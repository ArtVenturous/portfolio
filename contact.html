<!DOCTYPE HTML>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="icon" href="assets/icon.png">
</head>
<body>
    <div class="header">
        <img src="assets/profile.png" alt="Profile Picture" class="profile-pic">
        <h1>April Rose Templo Orandain</h1>
    </div>
    <div class="navbar">
        <a href="index.html">Home</a>
        <a href="projects.html">Projects</a>
        <a href="about.html">About</a>
        <a href="contact.html" class="active">Contact me</a>
    </div>
    <div class="content-wrapper">
      <div class="main">
        <h1>Get in touch</h1>
        <section id="contact" class="main">
            <div class="contact-postcard">
                <h2>What goes on?</h2>
                <form id="contact-form">
                    <div class="postcard-message-side" style="grid-column: span 2;">
                        <div class="form-group">
                            <!-- <label for="message">What goes on?</label> -->
                            <textarea id="message" name="message" rows="6" placeholder="Write your message here... what would you like to say to me?" required></textarea>
                        </div>
                    </div>
                    <button type="submit" class="btn">Send via Email</button>
                </form>
            </div>
        </section>
        <br><br><br>
        <h1>Contact Me</h1>
        <p>If you would like to get in touch with me feel further, please feel free to reach out through any of the following:</p>
        <ul>
          <a href="https://www.facebook.com/artorandain/" target="_blank"><li><strong>Facebook / Messenger</strong></li></a>
          <!-- <a href="mailto:april.orandain@gmail.com" target="_blank"><li><strong>Email</strong></li></a> -->
          <a href="tel:+639085007951" target="_blank"><li><strong>Cellphone Number</strong></li></a>
        </ul>
        
      </div>
    </div>
    <script>
        const contactForm = document.getElementById('contact-form');

        contactForm.addEventListener('submit', (e) => {
            e.preventDefault();
            
            const message = document.getElementById('message').value;
            const myEmail = 'april.orandain@gmail.com';
            
            const subject = encodeURIComponent('New Postcard Message from Portfolio');
            const body = encodeURIComponent(message);
            
            // Open in separate window/app and reset form
            window.open(`mailto:${myEmail}?subject=${subject}&body=${body}`, '_blank');
            contactForm.reset();
        });
    </script>
  </body>
</html>
